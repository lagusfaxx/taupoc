# Despliegue de TAUPOC Chile.
#
# En Coolify: crea un recurso "Docker Compose" apuntando a este archivo y
# define las variables de entorno en el panel del proyecto. El dominio se asigna
# al servicio "app"; Coolify se encarga del TLS y del proxy inverso.
#
# Los valores de entorno no deben contener el signo $ sin escapar: Docker Compose
# lo interpreta como una variable. Si un secreto lo lleva, escríbelo como $$.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_MP_PUBLIC_KEY: ${NEXT_PUBLIC_MP_PUBLIC_KEY}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taupoc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taupoc}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      MP_MODE: ${MP_MODE:-test}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      NEXT_PUBLIC_MP_PUBLIC_KEY: ${NEXT_PUBLIC_MP_PUBLIC_KEY}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL}
      # Activa el servidor MCP en /api/mcp. Vacío lo deja apagado.
      MCP_TOKEN: ${MCP_TOKEN:-}
      # Agente de impresión (packing slips). Vacío lo deja apagado.
      PRINT_AGENT_TOKEN: ${PRINT_AGENT_TOKEN:-}
      # Webhook de PayPal (cobra aunque el comprador no vuelva). Vacío lo deja apagado.
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      # Libera reservas de stock vencidas desde una tarea programada. Vacío lo deja apagado.
      CRON_TOKEN: ${CRON_TOKEN:-}
      # Tienda internacional: dominios, URLs públicas y si se deja indexar.
      STORE_INTL_HOSTS: ${STORE_INTL_HOSTS:-taupoc.lat}
      SITE_URL_CL: ${SITE_URL_CL:-}
      SITE_URL_INTL: ${SITE_URL_INTL:-https://taupoc.lat}
      INTL_INDEXABLE: ${INTL_INDEXABLE:-false}
      UPLOAD_DIR: /app/public/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      RUN_SEED: ${RUN_SEED:-false}
      # Vuelve a escribir el catálogo aunque ya exista, pisando lo editado.
      FORCE_SEED: ${FORCE_SEED:-false}
    # Sin publicar el puerto en el host: el proxy de Coolify llega al contenedor
    # por la red interna de Docker. Publicarlo choca con las demás aplicaciones
    # del servidor, que ya ocupan el 3000.
    expose:
      - '3000'
    volumes:
      # Volumen persistente: acá viven las fotos de producto subidas
      # desde el panel. Sin esto se pierden en cada despliegue.
      - taupoc-uploads:/app/public/uploads
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taupoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-taupoc}
    volumes:
      - taupoc-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-taupoc} -d ${POSTGRES_DB:-taupoc}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  taupoc-uploads:
  taupoc-db:
